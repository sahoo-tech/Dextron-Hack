[build]
  command = "npm install && npm run build"
  publish = "dist"
  node_version = "16"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "16"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"
  NODE_VERSION = "18"

[dev]
  command = "npm run dev"
  port = 3000